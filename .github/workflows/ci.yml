name: CI - Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancelar workflows anteriores si hay nuevos commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true # No bloquear por warnings de lint
      
      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 1
  
  # ============================================
  # FUNCTIONS
  # ============================================
  functions:
    name: Functions - Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      
      - name: Install dependencies
        working-directory: ./functions
        run: npm ci
      
      - name: Install Firebase Emulator
        run: |
          curl -sL https://firebase.tools | bash
          firebase setup:emulators:firestore
          firebase setup:emulators:functions
      
      - name: Run Tests
        working-directory: ./functions
        run: npm test
        env:
          FIREBASE_PROJECT_ID: demo-project
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_FUNCTIONS_EMULATOR_HOST: localhost:5001
      
      - name: Run Financial Tests
        working-directory: ./functions
        run: node test/financial.test.js
  
  # ============================================
  # I18N VALIDATION
  # ============================================
  i18n:
    name: i18n - Validate Translations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Validate i18n keys
        run: node scripts/validate_i18n.js
  
  # ============================================
  # FIREBASE RULES VALIDATION
  # ============================================
  firebase-rules:
    name: Firebase - Validate Rules
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash
      
      - name: Validate Firestore Rules
        run: firebase deploy --only firestore:rules --dry-run
        continue-on-error: true # Dry run no siempre disponible
      
      - name: Validate Storage Rules
        run: firebase deploy --only storage --dry-run
        continue-on-error: true
  
  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security - Secret Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Secret Scan
        uses: trufflesecurity/trufflehog@master
        with:
          path: .
          since: HEAD~1
  
  # ============================================
  # SUMMARY
  # ============================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend, functions, i18n, firebase-rules, security]
    
    if: always()
    
    steps:
      - name: Check CI Status
        run: |
          echo "=== CI Pipeline Summary ==="
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Functions: ${{ needs.functions.result }}"
          echo "i18n: ${{ needs.i18n.result }}"
          echo "Firebase Rules: ${{ needs.firebase-rules.result }}"
          echo "Security: ${{ needs.security.result }}"
          
          if [[ "${{ needs.frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.functions.result }}" == "failure" ]] || \
             [[ "${{ needs.i18n.result }}" == "failure" ]]; then
            echo "❌ CI FAILED"
            exit 1
          else
            echo "✅ CI PASSED"
          fi
