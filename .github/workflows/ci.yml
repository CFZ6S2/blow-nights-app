name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run check

      - name: Run tests
        run: npm run test

  functions-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Firestore Rules tests
        run: npx firebase emulators:exec --only firestore "npm run test:rules"

  ci-summary:
    runs-on: ubuntu-latest
    needs: [frontend-test, functions-test]
    if: always()
    steps:
      - name: CI Summary
        run: |
          if [ "${{ needs.frontend-test.result }}" == "success" ] && [ "${{ needs.functions-test.result }}" == "success" ]; then
            echo "✅ All CI checks passed!"
            exit 0
          else
            echo "❌ CI Summary: Some checks failed"
            echo "  - frontend-test: ${{ needs.frontend-test.result }}"
            echo "  - functions-test: ${{ needs.functions-test.result }}"
            exit 1
          fi
